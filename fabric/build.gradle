plugins { id 'java-library';id 'fabric-loom' }
base.archivesName='essence-api-fabric-1.21.1'
java { toolchain.languageVersion=JavaLanguageVersion.of(21);withSourcesJar() }
sourceSets.main.java.srcDir '../src/main/java'
sourceSets.main.resources.srcDir '../src/main/resources'
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings loom.layered { officialMojangMappings();parchment('org.parchmentmc.data:parchment-1.21:2024.11.10@zip') }
 modImplementation 'net.fabricmc:fabric-loader:0.16.9'
}
processResources { exclude 'META-INF/neoforge.mods.toml'; filesMatching('fabric.mod.json'){expand(version:project.version)} }
jar { from(rootProject.file('LICENSE')) }
