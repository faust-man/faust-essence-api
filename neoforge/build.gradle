plugins { id 'java-library';id 'net.neoforged.moddev' }
base.archivesName='essence-api-neoforge-1.21.1'
java { toolchain.languageVersion=JavaLanguageVersion.of(21);withSourcesJar() }
sourceSets.main.java.srcDir '../src/main/java'
sourceSets.main.resources.srcDir '../src/main/resources'
neoForge {
 version='21.1.80'
 parchment { minecraftVersion='1.21';mappingsVersion='2024.11.10' }
 mods { essence_api { sourceSet sourceSets.main } }
}
processResources { exclude 'fabric.mod.json'; filesMatching('META-INF/neoforge.mods.toml'){expand(version:project.version)} }
jar { from(rootProject.file('LICENSE')) }

sourceSets.test { compileClasspath += sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.compileClasspath }
tasks.register('contractTest',JavaExec){dependsOn testClasses;classpath=sourceSets.test.runtimeClasspath;mainClass='com.faust.essence.api.ApiContractTest'}
tasks.named('test'){dependsOn contractTest}

sourceSets.create('runtimeChecks')
sourceSets.runtimeChecks { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath }
neoForge {
 runs { server { server(); programArguments.addAll '--nogui','--port','0' } }
 if(project.hasProperty('runtimeChecks'))mods.essence_api.sourceSet(sourceSets.runtimeChecks)
}
